# CodeDNA — production deployment profile (Phase 25).
#
# A standalone file (it does not extend docker-compose.yml): no bind mounts,
# no development commands, no published data or internal service ports.
# Images are built from the production targets; configuration and secrets
# are injected at runtime from an environment file kept OUTSIDE the
# repository:
#
#   docker compose -f docker-compose.prod.yml --env-file /etc/codedna/production.env config --quiet
#   docker compose -f docker-compose.prod.yml --env-file /etc/codedna/production.env build
#   docker compose -f docker-compose.prod.yml --env-file /etc/codedna/production.env run --rm migrate
#   docker compose -f docker-compose.prod.yml --env-file /etc/codedna/production.env up -d
#
# See docs/operations/production-deployment.md (steps, TLS, gVisor),
# docs/operations/production-configuration.md (every variable) and
# .env.production.example (the template, without values).
#
# Networks (docs/operations/security-baseline.md#network-segmentation):
#   public    nginx only (published 80/443); egress allowed
#   web       nginx <-> frontend                         (internal)
#   app       nginx <-> backend (PHP-FPM)                (internal)
#   data      Laravel containers <-> postgres, redis     (internal)
#   storage   backend, queue, minio-init <-> minio       (internal)
#   analysis  queue <-> analyzer, analyzer -> minio      (internal)
#   egress    backend, queue -> GitHub, AI provider, external object storage
# The evaluator has no network at all; it exchanges files with the queue
# worker through the challenge-spool volume, and runs under gVisor.

name: ${COMPOSE_PROJECT_NAME:-codedna-prod}

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-hardening: &hardening
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  logging: *logging
  restart: unless-stopped

# Shared by every Laravel container (backend, queue, scheduler, migrate).
# Values a deployment must never change are fixed here; everything else is
# required (:?) or has a safe default. No value below is a secret.
x-backend-environment: &backend-environment
  APP_NAME: ${APP_NAME:-CodeDNA}
  APP_ENV: production
  APP_DEBUG: "false"
  APP_KEY: ${APP_KEY:?APP_KEY is required (docs/operations/production-configuration.md)}
  APP_URL: https://${CODEDNA_DOMAIN:?CODEDNA_DOMAIN is required}
  APP_VERSION: ${APP_VERSION:?APP_VERSION is required (the release identifier)}
  LOG_CHANNEL: stderr
  LOG_LEVEL: ${LOG_LEVEL:-info}
  LOG_STDERR_FORMATTER: Monolog\Formatter\JsonFormatter
  DB_CONNECTION: pgsql
  DB_HOST: ${DB_HOST:-postgres}
  DB_PORT: ${DB_PORT:-5432}
  DB_DATABASE: ${DB_DATABASE:-codedna}
  DB_USERNAME: ${DB_USERNAME:-codedna}
  DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
  DB_SSLMODE: ${DB_SSLMODE:-prefer}
  # One connection per PHP-FPM worker, kept between requests: no TCP and
  # SCRAM authentication per request (Phase 26: twice the request throughput
  # measured). Plan max_connections for it (docs/performance/scaling-guide.md).
  DB_PERSISTENT: ${DB_PERSISTENT:-true}
  REDIS_CLIENT: phpredis
  # The bundled Redis by default; a customer-run Redis by setting REDIS_HOST
  # (then REDIS_SCHEME=tls is required, docs/enterprise/configuration-reference.md).
  REDIS_HOST: ${REDIS_HOST:-redis}
  REDIS_PORT: ${REDIS_PORT:-6379}
  REDIS_SCHEME: ${REDIS_SCHEME:-}
  REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
  CACHE_STORE: redis
  QUEUE_CONNECTION: redis
  SESSION_DRIVER: redis
  SESSION_LIFETIME: ${SESSION_LIFETIME:-120}
  SESSION_DOMAIN: ${SESSION_DOMAIN:-}
  SESSION_SECURE_COOKIE: "true"
  SESSION_SAME_SITE: ${SESSION_SAME_SITE:-lax}
  SANCTUM_STATEFUL_DOMAINS: ${CODEDNA_DOMAIN:?CODEDNA_DOMAIN is required}
  # Only Nginx, on the app network's fixed subnet, may set X-Forwarded-*.
  TRUSTED_PROXIES: 172.30.10.0/24
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
  MAIL_MAILER: ${MAIL_MAILER:-log}
  # S3-compatible source storage (ADR-003): the bundled private MinIO by
  # default; an external provider by setting SOURCE_STORAGE_ENDPOINT (https).
  SOURCE_STORAGE_ENDPOINT: ${SOURCE_STORAGE_ENDPOINT:-http://minio:9000}
  SOURCE_STORAGE_REGION: ${SOURCE_STORAGE_REGION:-us-east-1}
  SOURCE_STORAGE_BUCKET: ${SOURCE_STORAGE_BUCKET:-codedna}
  SOURCE_STORAGE_USE_PATH_STYLE: ${SOURCE_STORAGE_USE_PATH_STYLE:-true}
  SOURCE_STORAGE_ACCESS_KEY_ID: ${SOURCE_STORAGE_ACCESS_KEY_ID:?SOURCE_STORAGE_ACCESS_KEY_ID is required}
  SOURCE_STORAGE_SECRET_ACCESS_KEY: ${SOURCE_STORAGE_SECRET_ACCESS_KEY:?SOURCE_STORAGE_SECRET_ACCESS_KEY is required}
  SOURCE_STORAGE_PREFIX: ${SOURCE_STORAGE_PREFIX:-}
  SOURCE_MAX_ARCHIVE_BYTES: ${SOURCE_MAX_ARCHIVE_BYTES:-52428800}
  SOURCE_MAX_UNCOMPRESSED_BYTES: ${SOURCE_MAX_UNCOMPRESSED_BYTES:-209715200}
  SOURCE_MAX_FILES: ${SOURCE_MAX_FILES:-20000}
  SOURCE_MAX_SINGLE_FILE_BYTES: ${SOURCE_MAX_SINGLE_FILE_BYTES:-26214400}
  SOURCE_MAX_PATH_LENGTH: ${SOURCE_MAX_PATH_LENGTH:-512}
  SOURCE_URL_TTL_SECONDS: ${SOURCE_URL_TTL_SECONDS:-900}
  ANALYZER_URL: http://analyzer:8000
  ANALYZER_HMAC_SECRET: ${ANALYZER_HMAC_SECRET:?ANALYZER_HMAC_SECRET is required}
  ANALYZER_HMAC_SECRET_PREVIOUS: ${ANALYZER_HMAC_SECRET_PREVIOUS:-}
  ANALYZER_HARD_TIMEOUT_SECONDS: ${ANALYZER_HARD_TIMEOUT_SECONDS:-240}
  ANALYZER_CONNECT_TIMEOUT_SECONDS: ${ANALYZER_CONNECT_TIMEOUT_SECONDS:-5}
  ANALYZER_TIMEOUT_SECONDS: ${ANALYZER_TIMEOUT_SECONDS:-300}
  ANALYZER_MAX_ATTEMPTS: ${ANALYZER_MAX_ATTEMPTS:-3}
  # The analyzer's concurrency (same variable): workers wait for one of its
  # slots instead of collecting ANALYZER_BUSY answers (Phase 26).
  ANALYZER_MAX_CONCURRENCY: ${ANALYZER_MAX_CONCURRENCY:-2}
  ANALYZER_SLOT_WAIT_SECONDS: ${ANALYZER_SLOT_WAIT_SECONDS:-20}
  ANALYSIS_JOB_TIMEOUT_SECONDS: ${ANALYSIS_JOB_TIMEOUT_SECONDS:-330}
  ANALYSIS_QUEUE_RETRY_AFTER: ${ANALYSIS_QUEUE_RETRY_AFTER:-360}
  ANALYZER_CONTRACTS_PATH: /var/www/contracts/analyzer/v1
  CODEDNA_SCORING_VERSION: ${CODEDNA_SCORING_VERSION:-1.0.0}
  CODEDNA_COMPETENCY_VERSION: ${CODEDNA_COMPETENCY_VERSION:-1.0.0}
  CODEDNA_SKILL_GAP_VERSION: ${CODEDNA_SKILL_GAP_VERSION:-1.0.0}
  CODEDNA_ROADMAP_VERSION: ${CODEDNA_ROADMAP_VERSION:-1.0.0}
  CODEDNA_ROADMAP_RULES_VERSION: ${CODEDNA_ROADMAP_RULES_VERSION:-1.0.0}
  CODEDNA_GROWTH_RULES_VERSION: ${CODEDNA_GROWTH_RULES_VERSION:-1.0.0}
  CODEDNA_ASSESSMENT_VERSION: ${CODEDNA_ASSESSMENT_VERSION:-1.0.0}
  GITHUB_APP_ID: ${GITHUB_APP_ID:-}
  GITHUB_APP_SLUG: ${GITHUB_APP_SLUG:-}
  GITHUB_APP_CLIENT_ID: ${GITHUB_APP_CLIENT_ID:-}
  GITHUB_APP_CLIENT_SECRET: ${GITHUB_APP_CLIENT_SECRET:-}
  GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
  GITHUB_CALLBACK_URL: https://${CODEDNA_DOMAIN:?CODEDNA_DOMAIN is required}/app/github/callback
  GITHUB_API_URL: https://api.github.com
  GITHUB_WEB_URL: https://github.com
  GITHUB_ARCHIVE_ORIGINS: https://codeload.github.com
  GITLAB_CLIENT_ID: ${GITLAB_CLIENT_ID:-}
  GITLAB_CLIENT_SECRET: ${GITLAB_CLIENT_SECRET:-}
  GITLAB_BASE_URL: ${GITLAB_BASE_URL:-https://gitlab.com}
  GITLAB_CALLBACK_URL: https://${CODEDNA_DOMAIN:?CODEDNA_DOMAIN is required}/app/integrations/gitlab/callback
  BITBUCKET_CLIENT_ID: ${BITBUCKET_CLIENT_ID:-}
  BITBUCKET_CLIENT_SECRET: ${BITBUCKET_CLIENT_SECRET:-}
  BITBUCKET_CALLBACK_URL: https://${CODEDNA_DOMAIN:?CODEDNA_DOMAIN is required}/app/integrations/bitbucket/callback
  BITBUCKET_API_URL: https://api.bitbucket.org
  BITBUCKET_WEB_URL: https://bitbucket.org
  BITBUCKET_ARCHIVE_ORIGINS: https://bitbucket.org
  # AI (Phases 15 and 29): local Ollama by default (profile local-ai); a remote
  # endpoint needs https and AI_ALLOW_REMOTE_ENDPOINT=true (validated at boot).
  CODEDNA_INSIGHTS_VERSION: ${CODEDNA_INSIGHTS_VERSION:-1.0.0}
  AI_ENABLED: ${AI_ENABLED:-false}
  AI_PROVIDER: ${AI_PROVIDER:-ollama}
  AI_MODEL: ${AI_MODEL:-qwen2.5-coder:7b}
  AI_BASE_URL: ${AI_BASE_URL:-http://ollama:11434}
  AI_API_KEY: ${AI_API_KEY:-}
  AI_ALLOW_REMOTE_ENDPOINT: ${AI_ALLOW_REMOTE_ENDPOINT:-false}
  AI_STRUCTURED_OUTPUT: ${AI_STRUCTURED_OUTPUT:-json_schema}
  AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-120}
  AI_JOB_TIMEOUT_SECONDS: ${AI_JOB_TIMEOUT_SECONDS:-180}
  AI_MAX_ATTEMPTS: ${AI_MAX_ATTEMPTS:-3}
  AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-2000}
  AI_CONTEXT_TOKENS: ${AI_CONTEXT_TOKENS:-8192}
  AI_MAX_CONCURRENCY: ${AI_MAX_CONCURRENCY:-1}
  AI_SLOT_WAIT_SECONDS: ${AI_SLOT_WAIT_SECONDS:-10}
  AI_KEEP_ALIVE: ${AI_KEEP_ALIVE:-5m}
  # Coding challenges: only through an evaluator that attests gVisor (or
  # CHALLENGE_EVALUATOR=none to disable execution entirely).
  CHALLENGE_ENABLED: ${CHALLENGE_ENABLED:-true}
  CHALLENGE_EVALUATOR: ${CHALLENGE_EVALUATOR:-spool}
  CHALLENGE_EVALUATOR_ISOLATION: gvisor
  CHALLENGE_EVALUATOR_SPOOL: /var/spool/codedna-challenges
  CHALLENGE_MAX_SOURCE_BYTES: ${CHALLENGE_MAX_SOURCE_BYTES:-16384}
  CHALLENGE_MAX_ATTEMPTS: ${CHALLENGE_MAX_ATTEMPTS:-5}
  # Billing: no real payment provider exists yet; "fake" is refused at boot.
  BILLING_PROVIDER: none
  BILLING_WEBHOOK_SECRET: ""
  # Self-service registration (Phase 27): open, restricted (allowed email
  # domains) or closed.
  REGISTRATION_MODE: ${REGISTRATION_MODE:-open}
  REGISTRATION_ALLOWED_EMAIL_DOMAINS: ${REGISTRATION_ALLOWED_EMAIL_DOMAINS:-}
  # Enterprise license (Phase 27, docs/enterprise/licensing.md): the
  # codedna_license secret; /dev/null (no license, Community edition) by default.
  CODEDNA_LICENSE_PATH: /run/secrets/codedna_license

x-backend: &backend
  <<: *hardening
  image: ${CODEDNA_IMAGE_PREFIX:-codedna}-backend:${APP_VERSION:?APP_VERSION is required}
  environment: *backend-environment
  # Writable state is memory-only: Laravel's caches, compiled views and
  # upload temporaries. Nothing persistent lives in a container.
  tmpfs:
    - /var/www/backend/storage:size=160m,mode=0700,uid=10010,gid=10010
    - /tmp:size=16m,mode=1777
  group_add:
    # The challenge spool group (Phase 16).
    - "10500"
  # The enterprise license (Phase 27), read-only; empty when none is installed.
  secrets:
    - codedna_license

services:
  nginx:
    <<: *hardening
    build:
      context: ./docker/nginx/production
    image: ${CODEDNA_IMAGE_PREFIX:-codedna}-nginx:${APP_VERSION:?APP_VERSION is required}
    environment:
      CODEDNA_DOMAIN: ${CODEDNA_DOMAIN:?CODEDNA_DOMAIN is required}
    # The only published ports. Bind address configurable (e.g. a private
    # address behind a TCP load balancer).
    ports:
      - "${PUBLIC_BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-80}:8080"
      - "${PUBLIC_BIND_ADDRESS:-0.0.0.0}:${HTTPS_PORT:-443}:8443"
    # File secrets keep their host ownership and mode (Compose without Swarm
    # ignores uid/gid/mode): the key must be readable by group 101, the
    # unprivileged nginx user, e.g. root:101 mode 0640
    # (docs/operations/production-deployment.md#tls).
    secrets:
      - tls_certificate
      - tls_private_key
    tmpfs:
      - /tmp:size=32m,mode=1777
    # Request bodies (uploads up to 55 MiB) are buffered on disk, not in the
    # /tmp tmpfs (Phase 30); Nginx deletes each file when its request ends.
    volumes:
      - nginx_request_bodies:/var/cache/codedna/client_body
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - public
      - web
      - app
    mem_limit: 256m
    cpus: 1
    pids_limit: 128
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/nginx-health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    <<: *hardening
    build:
      context: ./frontend
      dockerfile: ../docker/node/Dockerfile
      target: production
    image: ${CODEDNA_IMAGE_PREFIX:-codedna}-frontend:${APP_VERSION:?APP_VERSION is required}
    environment:
      NODE_ENV: production
      # Server-side only; never sent to the browser. 8081 is Nginx's
      # internal listener (the only one that accepts a forwarded client IP).
      BACKEND_INTERNAL_URL: http://nginx:8081
      FRONTEND_URL: https://${CODEDNA_DOMAIN:?CODEDNA_DOMAIN is required}
    tmpfs:
      - /tmp:size=16m,mode=1777
    networks:
      - web
    mem_limit: 512m
    cpus: 1
    pids_limit: 128
    healthcheck:
      test:
        - CMD
        - node
        - -e
        # A route that never calls the API (Nginx waits for this check).
        - "fetch('http://127.0.0.1:3000/healthz').then(r => process.exit(r.status === 404 ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    <<: *backend
    build:
      context: ./backend
      dockerfile: ../docker/php/Dockerfile
      target: production
      additional_contexts:
        php: ./docker/php
        contracts: ./packages/api-contracts
    volumes:
      - challenge-spool:/var/spool/codedna-challenges
      # Upload temporaries on disk, not in the memory-backed storage tmpfs:
      # concurrent uploads near the 50 MiB limit would exhaust it (Phase 30).
      # PHP deletes each file when its request ends.
      - backend_uploads:/var/cache/codedna/uploads
    # SIGQUIT lets PHP-FPM finish in-flight requests (process_control_timeout).
    stop_signal: SIGQUIT
    stop_grace_period: 35s
    # required: false lets docker/enterprise/compose.external-*.yml switch a
    # bundled data service off for a customer-run one (Phase 27); when the
    # bundled service runs, it is still waited for.
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
        required: false
      minio-init:
        condition: service_completed_successfully
        required: false
    networks:
      - app
      - data
      - storage
      - egress
      # The local AI runtime, for the cached availability check (Phase 29).
      - ai
    mem_limit: 768m
    cpus: 2
    pids_limit: 256
    healthcheck:
      test: ["CMD", "codedna-healthcheck"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 30s

  # Queue worker: every queued job (analysis, AI assessment, challenge
  # evaluation, GitHub import) is on the "analysis" connection, in that
  # priority. `queue:work` runs the immutable image code; it exits after
  # 500 jobs or an hour (bounded memory) and is restarted. On `docker
  # stop` it finishes the running job first: the grace period exceeds the
  # job timeout. Retries and backoff are per job class; a retried challenge
  # evaluation never executes a submission twice (spool protocol).
  queue:
    <<: *backend
    command:
      - php
      - artisan
      - queue:work
      - analysis
      - --queue=analysis,challenge,github
      - --timeout=${ANALYSIS_JOB_TIMEOUT_SECONDS:-330}
      - --sleep=3
      - --tries=0
      - --max-jobs=500
      - --max-time=3600
      - --memory=256
    stop_signal: SIGTERM
    stop_grace_period: 360s
    volumes:
      - challenge-spool:/var/spool/codedna-challenges
    depends_on:
      backend:
        condition: service_healthy
      analyzer:
        condition: service_healthy
    networks:
      - data
      - storage
      - analysis
      - egress
    mem_limit: 512m
    cpus: 1
    pids_limit: 128
    # Ready while the worker can read its queues in Redis (queue:monitor is
    # read-only and exits 1 when Redis is unreachable). The process itself is
    # PID 1: if it exits, the container stops.
    healthcheck:
      test: ["CMD", "php", "artisan", "queue:monitor", "analysis:analysis,analysis:challenge,analysis:github"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
      start_interval: 5s

  # AI worker (Phase 29): AI assessments and insights only, apart from the
  # analysis queue, so slow local inference never delays an analysis. It
  # reaches Ollama on the internal "ai" network (egress only for a deliberately
  # configured remote endpoint).
  ai-worker:
    <<: *backend
    command:
      - php
      - artisan
      - queue:work
      - analysis
      - --queue=assessment
      - --timeout=${AI_JOB_TIMEOUT_SECONDS:-180}
      - --sleep=3
      - --tries=0
      - --max-jobs=200
      - --max-time=3600
      - --memory=192
    stop_signal: SIGTERM
    stop_grace_period: 200s
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - data
      - ai
      - egress
    mem_limit: 384m
    cpus: 0.5
    pids_limit: 64
    # Ready while the worker can read its queues in Redis (queue:monitor is
    # read-only and exits 1 when Redis is unreachable). The process itself is
    # PID 1: if it exits, the container stops.
    healthcheck:
      test: ["CMD", "php", "artisan", "queue:monitor", "analysis:assessment"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
      start_interval: 5s

  # Local AI runtime (Phase 29, docs/operations/local-ai.md), optional: started
  # only with --profile local-ai. Hardened like every service (read-only root,
  # no capabilities); models live in their own volume and are pulled
  # explicitly by an operator, never at start. "egress" exists only for those
  # pulls; drop it after pulling for a fully offline runtime. No published
  # port. For an NVIDIA GPU add docker/ollama/compose.gpu.yml.
  ollama:
    <<: *hardening
    image: ollama/ollama:0.12.6
    profiles: ["local-ai"]
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-1}
    tmpfs:
      - /tmp:size=256m,mode=1777
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - ai
      - egress
    mem_limit: ${OLLAMA_MEM_LIMIT:-12g}
    cpus: ${OLLAMA_CPUS:-4}
    pids_limit: 512
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Exactly one scheduler (never scale this service): it runs the stale-run
  # sweepers and subscription expiry, each withoutOverlapping().
  scheduler:
    <<: *backend
    command: ["php", "artisan", "schedule:work"]
    stop_grace_period: 60s
    volumes:
      - challenge-spool:/var/spool/codedna-challenges
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - data
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    # Ready while Redis (queue and schedule locks) is reachable; read-only.
    # The scheduler is PID 1: if it exits, the container stops.
    healthcheck:
      test: ["CMD", "php", "artisan", "queue:monitor", "analysis:analysis"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
      start_interval: 5s

  # One-shot, run explicitly by the deployment procedure (never at start):
  #   docker compose -f docker-compose.prod.yml --env-file ... run --rm migrate
  migrate:
    <<: *backend
    command: ["php", "artisan", "migrate", "--force", "--no-interaction"]
    profiles: ["migrate"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
        required: false
    networks:
      - data
    healthcheck:
      disable: true

  analyzer:
    <<: *hardening
    build:
      context: ./analyzer
      dockerfile: ../docker/python/Dockerfile
      target: production
    image: ${CODEDNA_IMAGE_PREFIX:-codedna}-analyzer:${APP_VERSION:?APP_VERSION is required}
    # No storage credentials: sources arrive as short-lived pre-signed URLs
    # whose host must be on the allow-list.
    environment:
      ANALYZER_HMAC_SECRET: ${ANALYZER_HMAC_SECRET:?ANALYZER_HMAC_SECRET is required}
      ANALYZER_HMAC_SECRET_PREVIOUS: ${ANALYZER_HMAC_SECRET_PREVIOUS:-}
      ANALYZER_ALLOWED_SOURCE_HOSTS: ${ANALYZER_ALLOWED_SOURCE_HOSTS:-minio}
      ANALYZER_LOCAL_SOURCE_HOSTS: ${ANALYZER_LOCAL_SOURCE_HOSTS:-minio}
      ANALYZER_HARD_TIMEOUT_SECONDS: ${ANALYZER_HARD_TIMEOUT_SECONDS:-240}
      ANALYZER_MAX_CONCURRENCY: ${ANALYZER_MAX_CONCURRENCY:-2}
      ANALYZER_MAX_ARCHIVE_BYTES: ${ANALYZER_MAX_ARCHIVE_BYTES:-52428800}
      ANALYZER_MAX_EXTRACTED_BYTES: ${ANALYZER_MAX_EXTRACTED_BYTES:-209715200}
      ANALYZER_MAX_FILES: ${ANALYZER_MAX_FILES:-20000}
      ANALYZER_MAX_ENTRY_BYTES: ${ANALYZER_MAX_ENTRY_BYTES:-26214400}
      ANALYZER_MAX_FILE_BYTES: ${ANALYZER_MAX_FILE_BYTES:-1048576}
      ANALYZER_MAX_PATH_LENGTH: ${ANALYZER_MAX_PATH_LENGTH:-512}
      ANALYZER_PARSE_TIMEOUT_MS: ${ANALYZER_PARSE_TIMEOUT_MS:-5000}
      ANALYZER_MAX_AST_NODES: ${ANALYZER_MAX_AST_NODES:-1000000}
      ANALYZER_MAX_TOTAL_AST_NODES: ${ANALYZER_MAX_TOTAL_AST_NODES:-10000000}
      ANALYZER_MAX_PARSED_FILES: ${ANALYZER_MAX_PARSED_FILES:-20000}
      ANALYZER_WORKSPACE_ROOT: /tmp/codedna
      LOG_LEVEL: ${LOG_LEVEL:-info}
    tmpfs:
      - /tmp:size=64m,mode=1777
      # Per-run workspaces: ANALYZER_MAX_CONCURRENCY x (archive + extracted).
      - /tmp/codedna:size=512m,mode=0700,uid=10001,gid=10001
    networks:
      - analysis
    mem_limit: 1536m
    cpus: 2
    pids_limit: 256
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/internal/v1/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Challenge evaluator: runs untrusted code. Production requires the gVisor
  # runtime (runsc) on the host; the image runs in production mode and
  # refuses to start unless it attests gVisor (no fallback). Without it the
  # evaluator stays down and Laravel reports challenge evaluation as
  # unavailable. EVALUATOR_RUNTIME exists only to name a differently
  # registered runsc runtime (e.g. "runsc-kvm"); any non-gVisor runtime is
  # refused by the evaluator itself.
  evaluator:
    <<: *hardening
    build:
      context: ./evaluator
      dockerfile: ../docker/evaluator/Dockerfile
      target: production
    image: ${CODEDNA_IMAGE_PREFIX:-codedna}-evaluator:${APP_VERSION:?APP_VERSION is required}
    runtime: ${EVALUATOR_RUNTIME:-runsc}
    init: true
    environment:
      EVALUATOR_PRODUCTION: "true"
      EVALUATOR_ISOLATION: gvisor
      CHALLENGE_EXECUTION_TIMEOUT: ${CHALLENGE_EXECUTION_TIMEOUT:-5}
      CHALLENGE_MAX_MEMORY_MB: ${CHALLENGE_MAX_MEMORY_MB:-256}
      CHALLENGE_MAX_PROCESSES: ${CHALLENGE_MAX_PROCESSES:-16}
      CHALLENGE_MAX_OUTPUT_BYTES: ${CHALLENGE_MAX_OUTPUT_BYTES:-65536}
      CHALLENGE_MAX_SOURCE_BYTES: ${CHALLENGE_MAX_SOURCE_BYTES:-16384}
      # Must match the /sandbox/N tmpfs mounts below (one per slot).
      CHALLENGE_MAX_CONCURRENT_EVALUATIONS: "2"
    network_mode: none
    tmpfs:
      - /tmp:size=8m,mode=0700
      - /sandbox/0:size=16m,mode=0700,uid=10002,gid=10002
      - /sandbox/1:size=16m,mode=0700,uid=10003,gid=10003
      - /dev/shm:size=64k,mode=0755
    sysctls:
      kernel.shmmni: "0"
      kernel.msgmni: "0"
      kernel.sem: "0 0 0 0"
    volumes:
      - challenge-spool:/spool
    group_add:
      - "10500"
    cap_add:
      - SETUID
      - SETGID
      - KILL
    mem_limit: 768m
    cpus: 1
    pids_limit: 128
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import json,time; b=json.load(open('/spool/heartbeat')); assert time.time() - b['at'] < 15 and b['isolation'] == 'gvisor'"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  postgres:
    <<: *hardening
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-codedna}
      POSTGRES_USER: ${DB_USERNAME:-codedna}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      # scram-sha-256 for every connection (the image default for new clusters).
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=scram-sha-256
    # The entrypoint initialises the volume as root, then drops to postgres.
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    tmpfs:
      - /var/run/postgresql:size=1m,uid=70,gid=70,mode=0775
      - /tmp:size=64m,mode=1777
    shm_size: 256m
    stop_grace_period: 60s
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - data
    mem_limit: 1g
    cpus: 2
    pids_limit: 256
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    <<: *hardening
    image: redis:7.4-alpine
    # Password required; append-only persistence so queued jobs survive a
    # restart; bounded memory without eviction: queued jobs and sessions are
    # never silently dropped (writes fail loudly at the limit instead; see
    # docs/operations/production-configuration.md#redis). Sessions, cache and
    # queues use separate logical databases (REDIS_DB / REDIS_CACHE_DB).
    command:
      - sh
      - -c
      - >-
        exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes --appendfsync everysec
        --maxmemory ${REDIS_MAXMEMORY:-384mb} --maxmemory-policy noeviction --protected-mode yes
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    # Runs as the image's unprivileged redis user (owner of /data); no
    # capability is needed.
    user: redis
    volumes:
      - redis_data:/data
    networks:
      - data
    mem_limit: 512m
    cpus: 1
    pids_limit: 64
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Bundled private object storage (ADR-003). Never published; reachable
  # only on the storage and analysis networks. An external S3-compatible
  # provider can replace it (docs/operations/production-configuration.md#object-storage).
  minio:
    <<: *hardening
    image: cgr.dev/chainguard/minio:latest-dev@sha256:f4420fd36b8ea52655addd4bf3458c16ce78af7d0ceb605cf25039b8488a63f4
    command: ["server", "/data", "--address", ":9000", "--console-address", "127.0.0.1:9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_SITE_REGION: ${SOURCE_STORAGE_REGION:-us-east-1}
      MINIO_BROWSER: "off"
    tmpfs:
      - /tmp:size=16m,mode=1777
    volumes:
      - minio_data:/data
    networks:
      - storage
      - analysis
    mem_limit: 1g
    cpus: 1
    pids_limit: 256
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: the bucket (no anonymous access) and the bucket-scoped
  # application user. Idempotent.
  minio-init:
    <<: *hardening
    build:
      context: ./docker/minio
    image: ${CODEDNA_IMAGE_PREFIX:-codedna}-minio-init:${APP_VERSION:?APP_VERSION is required}
    restart: "no"
    environment:
      MC_CONFIG_DIR: /tmp/.mc
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      SOURCE_STORAGE_BUCKET: ${SOURCE_STORAGE_BUCKET:-codedna}
      SOURCE_STORAGE_ACCESS_KEY_ID: ${SOURCE_STORAGE_ACCESS_KEY_ID:?SOURCE_STORAGE_ACCESS_KEY_ID is required}
      SOURCE_STORAGE_SECRET_ACCESS_KEY: ${SOURCE_STORAGE_SECRET_ACCESS_KEY:?SOURCE_STORAGE_SECRET_ACCESS_KEY is required}
    tmpfs:
      - /tmp:size=8m,mode=1777
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - storage

# TLS certificate and key for Nginx: files on the host, outside the
# repository, readable only by the deploying user. Never in an image.
secrets:
  # Signed enterprise license (Phase 27, docs/enterprise/licensing.md). Not
  # a secret in the cryptographic sense (it grants nothing elsewhere), but
  # mounted the same read-only way. /dev/null = no license.
  codedna_license:
    file: ${CODEDNA_LICENSE_FILE:-/dev/null}
  tls_certificate:
    file: ${TLS_CERTIFICATE_FILE:?TLS_CERTIFICATE_FILE is required (path to the PEM certificate chain)}
  tls_private_key:
    file: ${TLS_PRIVATE_KEY_FILE:?TLS_PRIVATE_KEY_FILE is required (path to the PEM private key)}

networks:
  public:
  web:
    internal: true
    ipam:
      config:
        # Fixed: Nginx's internal listener trusts X-Forwarded-For from here only.
        - subnet: 172.30.20.0/24
  app:
    internal: true
    ipam:
      config:
        # Fixed: Laravel's TRUSTED_PROXIES.
        - subnet: 172.30.10.0/24
  data:
    internal: true
  storage:
    internal: true
  analysis:
    internal: true
  egress:
  # Laravel <-> the local AI runtime (Phase 29); no route to the internet.
  ai:
    internal: true

volumes:
  challenge-spool:
  # Request-body and upload temporaries (Phase 30): disk, emptied as requests end.
  nginx_request_bodies:
  backend_uploads:
  postgres_data:
  redis_data:
  minio_data:
  # Local AI models (Phase 29), pulled explicitly; never in an image or the repository.
  ollama_models:
