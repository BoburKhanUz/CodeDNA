; CodeDNA development PHP settings (loaded after the image defaults).

expose_php = Off

; Exception traces never record argument values (Phase 21): a token, code
; or key passed to a function must not reach a log or failed_jobs through
; a stack trace. #[\SensitiveParameter] marks them as well.
zend.exception_ignore_args = On
memory_limit = 256M
max_execution_time = 60

; Source archive uploads: 50 MiB limit (ANALYZER_MAX_ARCHIVE_BYTES) plus
; multipart overhead. Keep in sync with client_max_body_size in Nginx.
upload_max_filesize = 52M
post_max_size = 55M

; OPcache revalidates on every request so bind-mounted source changes apply
; immediately (development only).
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
