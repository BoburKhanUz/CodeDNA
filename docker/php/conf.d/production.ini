; CodeDNA production PHP settings (Phase 25), loaded on top of
; php.ini-production. Keep the shared limits in sync with codedna.ini.

expose_php = Off

; Errors are logged (to stderr, collected by the container runtime), never
; shown to a client. Laravel renders its own JSON errors (APP_DEBUG=false).
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
html_errors = Off

; Exception traces never record argument values (Phase 21).
zend.exception_ignore_args = On
zend.assertions = -1

memory_limit = 256M
max_execution_time = 60
max_input_time = 60

; Source archive uploads: 50 MiB limit plus multipart overhead. Keep in sync
; with client_max_body_size in Nginx.
upload_max_filesize = 52M
post_max_size = 55M
; Uploads are buffered on a disk volume (docker-compose.prod.yml), never the
; read-only root or the memory-backed storage tmpfs (Phase 30).
upload_tmp_dir = /var/cache/codedna/uploads
sys_temp_dir = /var/www/backend/storage/tmp

; Sessions are handled by Laravel (Redis); PHP's own session module is unused.
session.use_strict_mode = 1
session.cookie_httponly = 1
session.cookie_secure = 1

; No remote includes or URL fopen for include paths.
allow_url_include = Off

; OPcache: code is immutable in the image, so never re-check timestamps.
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.save_comments = 1
opcache.jit = disable
