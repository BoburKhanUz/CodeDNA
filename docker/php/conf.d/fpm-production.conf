; CodeDNA PHP-FPM pool overrides (production, Phase 25).
[global]
error_log = /proc/self/fd/2
log_limit = 8192
; Finish in-flight requests on SIGQUIT (docker stop sends it, see
; docker-compose.prod.yml stop_signal) before exiting.
process_control_timeout = 30s

[www]
listen = 9000
; Nginx is the access log of record.
access.log = /dev/null
; Workers inherit the container environment (configuration is injected at
; runtime, never baked into the image).
clear_env = no
catch_workers_output = yes
decorate_workers_output = no

pm = dynamic
pm.max_children = 16
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
; Recycle workers periodically (bounded memory growth).
pm.max_requests = 1000
; A request above this is killed (Nginx's fastcgi_read_timeout is 60s).
request_terminate_timeout = 75s
