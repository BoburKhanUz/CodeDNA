# CodeDNA production Nginx (Phase 25): the public TLS edge.
# Runs as the unprivileged "nginx" user (uid 101) on a read-only root
# filesystem: unprivileged ports inside the container (8080 HTTP, 8443 HTTPS,
# 8081 internal), pid and temporary files under /tmp (tmpfs).

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    server_tokens off;
    sendfile on;
    tcp_nopush on;

    # Slow or oversized requests are cut off early (slowloris-style abuse).
    client_header_timeout 15s;
    client_body_timeout 30s;
    send_timeout 30s;
    keepalive_timeout 30s;
    keepalive_requests 1000;
    reset_timedout_connection on;
    large_client_header_buffers 4 16k;
    client_max_body_size 1m;

    # Compression for static code and styles only: HTML and JSON responses
    # (which may carry user data next to attacker-chosen input) are never
    # compressed (BREACH).
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript image/svg+xml;

    include /tmp/conf.d/*.conf;
}
