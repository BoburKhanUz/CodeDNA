# Response security headers for the public HTTPS server (Phase 21/25,
# docs/operations/security-baseline.md#security-headers). Declared at server
# level only: no location below sets its own add_header (which would drop
# these), so every response, errors included, carries them.

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
# API and health responses: nothing may load or run. Pages: the baseline,
# under the per-response nonce policy the Next.js server sends itself
# (frontend/src/proxy.ts); browsers enforce both.
add_header Content-Security-Policy $codedna_csp always;

proxy_hide_header X-Powered-By;
fastcgi_hide_header X-Powered-By;
