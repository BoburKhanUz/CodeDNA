# Route the request to Laravel's front controller on PHP-FPM (production).
# Nginx needs no access to the backend files.

set $laravel_upstream backend:9000;
fastcgi_pass $laravel_upstream;

include fastcgi_params;
fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
fastcgi_param SCRIPT_NAME /index.php;
fastcgi_param DOCUMENT_ROOT /var/www/backend/public;

# httpoxy mitigation: never forward a client "Proxy" header as HTTP_PROXY.
fastcgi_param HTTP_PROXY "";

# Trusted proxy chain (Phase 21/25): Laravel trusts X-Forwarded-* only from
# this Nginx (TRUSTED_PROXIES is the app network), so every forwarded header
# is set here and never passed through from a client. The client address is
# the TCP peer ($remote_addr; on the internal listener, the address the
# Next.js server forwarded). The public site is HTTPS only, and the Host is
# the configured domain, never a client-chosen one.
fastcgi_param HTTP_X_FORWARDED_FOR $remote_addr;
fastcgi_param HTTP_X_FORWARDED_PROTO https;
fastcgi_param HTTP_X_FORWARDED_PORT 443;
fastcgi_param HTTP_X_FORWARDED_HOST "";
fastcgi_param HTTP_X_FORWARDED_PREFIX "";
fastcgi_param HTTP_X_FORWARDED_AWS_ELB "";
fastcgi_param HTTP_FORWARDED "";
fastcgi_param HTTP_HOST $codedna_domain;
fastcgi_param SERVER_NAME $codedna_domain;
fastcgi_param HTTPS on;

fastcgi_connect_timeout 5s;
fastcgi_send_timeout 60s;
fastcgi_read_timeout 60s;
fastcgi_buffers 16 16k;
fastcgi_buffer_size 32k;
