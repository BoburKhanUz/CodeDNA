# CodeDNA — single-origin development router (ADR-006).
#
#   /api/*, /sanctum/*, /up  -> Laravel (PHP-FPM, backend:9000)
#   /internal/*              -> 404, always (the analyzer is internal-only)
#   /nginx-health            -> Nginx's own liveness probe
#   everything else          -> Next.js dev server (frontend:3000), incl. HMR WebSocket
#
# The analyzer is deliberately absent: it lives on the `codedna-internal`
# network, which Nginx is not attached to (ADR-005).

server_tokens off;

# Resolve service names per request via Docker's embedded DNS, so recreating
# a container (new IP) never requires restarting Nginx.
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    server_name _;

    # Source archive uploads: 50 MiB limit plus multipart overhead.
    # Keep in sync with post_max_size in docker/php/conf.d/codedna.ini.
    client_max_body_size 55m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ^~ /internal/ {
        return 404;
    }

    location ^~ /api/ {
        include /etc/nginx/snippets/laravel-fastcgi.conf;
    }

    location ^~ /sanctum/ {
        include /etc/nginx/snippets/laravel-fastcgi.conf;
    }

    location = /up {
        include /etc/nginx/snippets/laravel-fastcgi.conf;
    }

    location / {
        set $frontend_upstream http://frontend:3000;
        proxy_pass $frontend_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;

        # Next.js dev server hot reload (WebSocket).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
    }
}
