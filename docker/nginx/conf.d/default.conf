# CodeDNA — single-origin development router (ADR-006).
#
#   /api/*, /sanctum/*, /up  -> Laravel (PHP-FPM, backend:9000)
#   /internal/*              -> 404, always (the analyzer is internal-only)
#   /nginx-health            -> Nginx's own liveness probe
#   everything else          -> Next.js dev server (frontend:3000), incl. HMR WebSocket
#
# A second, unpublished listener (nginx:8080) serves only the Next.js
# server's own calls to Laravel (BACKEND_INTERNAL_URL); see below.
#
# The analyzer is deliberately absent: it lives on the `codedna-internal`
# network, which Nginx is not attached to (ADR-005).

server_tokens off;

# Resolve service names per request via Docker's embedded DNS, so recreating
# a container (new IP) never requires restarting Nginx.
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    server_name _;

    # Source archive uploads: 50 MiB limit plus multipart overhead.
    # Keep in sync with post_max_size in docker/php/conf.d/codedna.ini.
    client_max_body_size 55m;

    include /etc/nginx/snippets/security-headers.conf;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ^~ /internal/ {
        return 404;
    }

    location ^~ /api/ {
        include /etc/nginx/snippets/laravel-fastcgi.conf;
        # A body above client_max_body_size never reaches Laravel: answer in
        # the API's error envelope instead of Nginx's HTML page.
        error_page 413 = @api_payload_too_large;
    }

    location @api_payload_too_large {
        default_type application/json;
        return 413 '{"error":{"code":"PAYLOAD_TOO_LARGE","message":"The request body is too large.","request_id":null}}';
    }

    location ^~ /sanctum/ {
        include /etc/nginx/snippets/laravel-fastcgi.conf;
    }

    location = /up {
        include /etc/nginx/snippets/laravel-fastcgi.conf;
    }

    location / {
        set $frontend_upstream http://frontend:3000;
        proxy_pass $frontend_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        # The TCP peer only: a client-sent X-Forwarded-For is never passed on.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;

        # Next.js dev server hot reload (WebSocket).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
    }
}

# Internal listener for the Next.js server's calls to Laravel (session check
# during server rendering). Not published to the host; only containers on the
# Docker networks reach it. Here, and only here, the X-Forwarded-For that the
# Next.js server forwards (set by the public listener above to the browser's
# address) is taken as the client address, so per-IP rate limits apply to the
# visitor and not to the frontend container.
server {
    listen 8080;
    server_name _;

    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive off;

    include /etc/nginx/snippets/security-headers.conf;

    location ^~ /api/ {
        include /etc/nginx/snippets/laravel-fastcgi.conf;
    }

    location / {
        return 404;
    }
}
