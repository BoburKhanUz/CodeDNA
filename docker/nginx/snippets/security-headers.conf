# Response security headers (Phase 21, docs/security/security-hardening.md).
# Sent on every response, errors included.
#
# The Content-Security-Policy is deliberately limited to directives that
# cannot break the Next.js application (its development server relies on
# inline and eval'd scripts and a WebSocket): framing, plugins, <base> and
# form targets. A script-src policy with nonces belongs to the production
# build (documented as a residual risk).
#
# Strict-Transport-Security is not set here: this server speaks plain HTTP
# in development. The production TLS terminator must send it.

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
