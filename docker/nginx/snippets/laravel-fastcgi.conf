# Route the request to Laravel's front controller on PHP-FPM.
# Nginx needs no access to the backend files: every Laravel route is served
# by public/index.php inside the backend container.

set $laravel_upstream backend:9000;
fastcgi_pass $laravel_upstream;

include fastcgi_params;
fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
fastcgi_param SCRIPT_NAME /index.php;
fastcgi_param DOCUMENT_ROOT /var/www/backend/public;

# httpoxy mitigation: never forward a client "Proxy" header as HTTP_PROXY.
fastcgi_param HTTP_PROXY "";

fastcgi_read_timeout 60s;
