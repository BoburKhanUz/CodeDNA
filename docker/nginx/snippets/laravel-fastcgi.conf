# Route the request to Laravel's front controller on PHP-FPM.
# Nginx needs no access to the backend files: every Laravel route is served
# by public/index.php inside the backend container.

set $laravel_upstream backend:9000;
fastcgi_pass $laravel_upstream;

include fastcgi_params;
fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
fastcgi_param SCRIPT_NAME /index.php;
fastcgi_param DOCUMENT_ROOT /var/www/backend/public;

# httpoxy mitigation: never forward a client "Proxy" header as HTTP_PROXY.
fastcgi_param HTTP_PROXY "";

# Client IP (Phase 21): Laravel trusts X-Forwarded-For from Nginx
# (TRUSTED_PROXIES), so never pass the client's own header through. A client
# could otherwise pick any IP per request and escape every IP-keyed rate
# limit (login, register, unauthenticated API). $remote_addr is the TCP peer,
# or on the internal listener the address the Next.js server forwarded.
fastcgi_param HTTP_X_FORWARDED_FOR $remote_addr;
fastcgi_param HTTP_X_FORWARDED_HOST "";
fastcgi_param HTTP_X_FORWARDED_PORT "";
fastcgi_param HTTP_X_FORWARDED_PREFIX "";

fastcgi_read_timeout 60s;
