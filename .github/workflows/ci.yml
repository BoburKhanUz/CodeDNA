# CodeDNA CI — Phase 01: repository and documentation foundation only.
#
# No application test suites exist yet. Jobs for the backend (Phase 03),
# frontend (Phase 04) and analyzer (Phase 08) are added in those phases.
# Tool versions are kept in sync with the Makefile.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MARKDOWNLINT_CLI2_VERSION: "0.23.3"
  YAMLLINT_VERSION: "1.38.0"
  ACTIONLINT_PY_VERSION: "1.7.12.25"
  GITLEAKS_VERSION: "v8.30.1"

jobs:
  foundation:
    name: Repository foundation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Check required files, links and .env.example hygiene
        run: python3 scripts/check_repo.py

      - name: Lint Markdown
        run: npx --yes "markdownlint-cli2@${MARKDOWNLINT_CLI2_VERSION}" "**/*.md"

      - name: Install YAML and workflow linters
        run: python3 -m pip install "yamllint==${YAMLLINT_VERSION}" "actionlint-py==${ACTIONLINT_PY_VERSION}"

      - name: Lint YAML
        run: yamllint --strict .

      - name: Lint GitHub Actions workflows
        run: actionlint

      - name: Validate docker-compose.yml
        env:
          # Placeholder only so interpolation succeeds; nothing is started.
          DB_PASSWORD: compose-config-check
        run: docker compose --env-file .env.example config --quiet

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false

      - name: Install gitleaks
        run: go install "github.com/zricethezav/gitleaks/v8@${GITLEAKS_VERSION}"

      - name: Scan git history
        run: "$(go env GOPATH)/bin/gitleaks git --redact --no-banner --verbose ."

      - name: Scan working tree
        run: "$(go env GOPATH)/bin/gitleaks dir --redact --no-banner --verbose ."
