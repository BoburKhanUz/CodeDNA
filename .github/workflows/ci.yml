# CodeDNA CI. Quality gates (docs/testing/test-strategy.md#ci-quality-gates):
#
# - foundation: repository checks, cross-service contract parity, linters;
# - secrets: gitleaks over history and working tree;
# - infrastructure: the full Docker stack, runtime smoke test, every test
#   suite (a failing test fails the job), linters, type checks, the frontend
#   production build and dependency audits;
# - regression (nightly and on demand): every suite three times on a fresh
#   stack, to surface flaky tests.
#
# Tool versions are kept in sync with the Makefile.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MARKDOWNLINT_CLI2_VERSION: "0.23.3"
  YAMLLINT_VERSION: "1.38.0"
  ACTIONLINT_PY_VERSION: "1.7.12.25"
  SHELLCHECK_PY_VERSION: "0.11.0.1"
  HADOLINT_PY_VERSION: "2.15.1.2"
  GITLEAKS_VERSION: "v8.30.1"

jobs:
  foundation:
    name: Repository foundation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Check required files, links and .env.example hygiene
        run: python3 scripts/check_repo.py

      - name: Check cross-service contract parity
        run: python3 scripts/check_contracts.py

      - name: Lint Markdown
        run: npx --yes "markdownlint-cli2@${MARKDOWNLINT_CLI2_VERSION}" "**/*.md"

      - name: Install linters
        run: >-
          python3 -m pip install
          "yamllint==${YAMLLINT_VERSION}"
          "actionlint-py==${ACTIONLINT_PY_VERSION}"
          "shellcheck-py==${SHELLCHECK_PY_VERSION}"
          "hadolint-py==${HADOLINT_PY_VERSION}"

      - name: Lint YAML
        run: yamllint --strict .

      - name: Lint GitHub Actions workflows
        run: actionlint

      - name: Lint shell scripts
        run: make lint-shell

      - name: Lint Dockerfiles
        run: make lint-docker

      - name: Validate docker-compose.yml
        run: make compose-config

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false

      - name: Install gitleaks
        run: |
          go install "github.com/zricethezav/gitleaks/v8@${GITLEAKS_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Scan git history
        run: gitleaks git --redact --no-banner --verbose .

      - name: Scan working tree
        run: gitleaks dir --redact --no-banner --verbose .

  infrastructure:
    name: Docker environment (build, smoke test, test suites)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Generate local .env (random throwaway secrets)
        run: ./scripts/setup.sh

      - name: Build images
        run: docker compose build

      - name: Start environment, wait for health, run migrations
        run: make up

      - name: Runtime smoke test
        run: make verify

      # CODEDNA_REQUIRE_EVALUATOR / CODEDNA_REQUIRE_SANDBOX (set by make test)
      # turn a missing evaluator into a failure instead of skipped tests.
      - name: Test suites (analyzer pytest, backend PHPUnit, frontend Vitest, evaluator sandbox)
        run: make test

      - name: Frontend lint and type check
        run: make lint-frontend

      - name: Backend code style (Laravel Pint)
        run: make lint-backend

      - name: Lint and type-check analyzer
        run: make lint-analyzer

      - name: Lint and type-check evaluator
        run: make lint-evaluator

      - name: Frontend production build
        run: make build-frontend

      - name: Dependency audits (Composer, npm runtime, analyzer Python)
        run: make audit

      - name: Service status and logs (on failure)
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=200

      - name: Tear down
        if: always()
        run: docker compose down -v

  regression:
    name: Nightly regression (suites repeated for flakiness)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Generate local .env (random throwaway secrets)
        run: ./scripts/setup.sh

      - name: Build images without cache
        run: docker compose build --no-cache

      - name: Start environment, wait for health, run migrations
        run: make up

      - name: Runtime smoke test
        run: make verify

      - name: Test suites, three consecutive runs
        run: |
          for run in 1 2 3; do
            echo "::group::run ${run}"
            make test
            echo "::endgroup::"
          done

      - name: Dependency audits
        run: make audit

      - name: Service status and logs (on failure)
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=200

      - name: Tear down
        if: always()
        run: docker compose down -v
