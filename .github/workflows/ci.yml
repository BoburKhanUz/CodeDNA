# CodeDNA CI — Phase 02: repository checks, secret scan, and a full Docker
# development-environment build + runtime smoke test.
#
# Application-level CI (backend Phase 03, frontend Phase 04, analyzer
# Phase 08) is added in those phases. Tool versions are kept in sync with the
# Makefile.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MARKDOWNLINT_CLI2_VERSION: "0.23.3"
  YAMLLINT_VERSION: "1.38.0"
  ACTIONLINT_PY_VERSION: "1.7.12.25"
  SHELLCHECK_PY_VERSION: "0.11.0.1"
  HADOLINT_PY_VERSION: "2.15.1.2"
  GITLEAKS_VERSION: "v8.30.1"

jobs:
  foundation:
    name: Repository foundation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Check required files, links and .env.example hygiene
        run: python3 scripts/check_repo.py

      - name: Lint Markdown
        run: npx --yes "markdownlint-cli2@${MARKDOWNLINT_CLI2_VERSION}" "**/*.md"

      - name: Install linters
        run: >-
          python3 -m pip install
          "yamllint==${YAMLLINT_VERSION}"
          "actionlint-py==${ACTIONLINT_PY_VERSION}"
          "shellcheck-py==${SHELLCHECK_PY_VERSION}"
          "hadolint-py==${HADOLINT_PY_VERSION}"

      - name: Lint YAML
        run: yamllint --strict .

      - name: Lint GitHub Actions workflows
        run: actionlint

      - name: Lint shell scripts
        run: make lint-shell

      - name: Lint Dockerfiles
        run: make lint-docker

      - name: Validate docker-compose.yml
        run: make compose-config

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false

      - name: Install gitleaks
        run: |
          go install "github.com/zricethezav/gitleaks/v8@${GITLEAKS_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Scan git history
        run: gitleaks git --redact --no-banner --verbose .

      - name: Scan working tree
        run: gitleaks dir --redact --no-banner --verbose .

  infrastructure:
    name: Docker environment (build + runtime smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Generate local .env (random throwaway secrets)
        run: ./scripts/setup.sh

      - name: Build images
        run: docker compose build

      - name: Start environment, wait for health, run migrations
        run: make up

      - name: Runtime smoke test
        run: make verify

      - name: Test suites (analyzer pytest, backend PHPUnit)
        run: make test

      - name: Backend code style (Laravel Pint)
        run: make lint-backend

      - name: Service status and logs (on failure)
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=200

      - name: Tear down
        if: always()
        run: docker compose down -v
